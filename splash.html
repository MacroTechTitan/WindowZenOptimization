<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTT Windows Infinite Optimizer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* mtt-splash.jpg already carries the WindowZen title, pillars and tagline,
     so nothing but the loading bar is drawn on top of it. This file is opened
     straight from disk, so the image path is relative, not /static/. */
  html, body {
    height: 100vh;
    overflow: hidden;
    user-select: none;
    background: #0a0f1e url('static/branding/mtt-splash.jpg') center / cover no-repeat;
  }
  /* Pinned to the bottom edge: the only strip of the artwork that stays
     text-free at every window size under background-size: cover. */
  .progress-bar-bg {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 4px;
    background: rgba(255,255,255,0.08);
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #06b6d4, #3b82f6, #8b5cf6);
    box-shadow: 0 0 10px rgba(59,130,246,0.8);
    animation: load 2.5s ease-in-out forwards;
  }
  @keyframes load {
    0% { width: 0%; }
    30% { width: 45%; }
    70% { width: 75%; }
    90% { width: 90%; }
    100% { width: 100%; }
  }
</style>
</head>
<body>
<div class="progress-bar-bg" role="progressbar" aria-label="Loading">
  <div class="progress-bar-fill"></div>
</div>
</body>
</html>
