<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTT Windows Infinite Optimizer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* mtt-splash.jpg already carries the WindowZen title, pillars and tagline,
     so nothing but the loading bar is drawn on top of it. */
  html, body {
    height: 100vh;
    overflow: hidden;
    user-select: none;
    background: #0a0f1e url('/static/branding/mtt-splash.jpg') center / cover no-repeat;
  }
  /* Pinned to the bottom edge: the only strip of the artwork that stays
     text-free at every window size under background-size: cover. */
  .progress-bar-bg {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 4px;
    background: rgba(255,255,255,0.08);
  }
  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #06b6d4, #3b82f6, #8b5cf6);
    box-shadow: 0 0 10px rgba(59,130,246,0.8);
    transition: width 0.4s ease;
  }
</style>
</head>
<body>
<div class="progress-bar-bg" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
  <div class="progress-bar-fill" id="bar"></div>
</div>
<script>
  const steps = [10, 30, 55, 78, 95, 100];
  const bar = document.getElementById('bar');
  const track = bar.parentNode;
  let i = 0;
  function nextStep() {
    if (i >= steps.length) return;
    const pct = steps[i++];
    bar.style.width = pct + '%';
    track.setAttribute('aria-valuenow', pct);
    if (i < steps.length) {
      setTimeout(nextStep, 420);
    } else {
      setTimeout(function() {
        document.body.style.transition = 'opacity 0.25s ease';
        document.body.style.opacity = '0';
        setTimeout(function() {
          window.location.replace('/app?mode=desktop');
        }, 260);
      }, 300);
    }
  }
  setTimeout(nextStep, 80);
</script>
</body>
</html>
