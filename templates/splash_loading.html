<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTT Windows Infinite Optimizer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #0a0f1e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    user-select: none;
  }
  .scanline {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
    pointer-events: none;
    z-index: 1;
  }
  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  .logo-wrap {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 8px;
  }
  .bolt {
    font-size: 52px;
    filter: drop-shadow(0 0 18px #06b6d4);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { filter: drop-shadow(0 0 12px #06b6d4); }
    50% { filter: drop-shadow(0 0 28px #06b6d4) drop-shadow(0 0 48px #3b82f6); }
  }
  .logo-text { display: flex; flex-direction: column; }
  .app-name {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #8b5cf6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-transform: uppercase;
  }
  .company {
    font-size: 11px;
    color: #475569;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .version-badge {
    background: rgba(6,182,212,0.1);
    border: 1px solid rgba(6,182,212,0.3);
    color: #06b6d4;
    font-size: 11px;
    font-family: 'Courier New', monospace;
    letter-spacing: 1px;
    padding: 4px 14px;
    border-radius: 20px;
  }
  .progress-wrap {
    width: 280px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
  }
  .progress-bar-bg {
    width: 100%;
    height: 3px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #06b6d4, #3b82f6, #8b5cf6);
    border-radius: 2px;
    transition: width 0.4s ease;
  }
  .status-text {
    font-size: 11px;
    color: #475569;
    font-family: 'Courier New', monospace;
    letter-spacing: 0.5px;
  }
  .mtt-link {
    position: fixed;
    bottom: 24px;
    font-size: 11px;
    color: #334155;
    letter-spacing: 0.5px;
  }
  .mtt-link span { color: #06b6d4; }
</style>
</head>
<body>
<div class="scanline"></div>
<div class="content">
  <div class="logo-wrap">
    <div class="bolt">⚡</div>
    <div class="logo-text">
      <div class="app-name">MTT Infinite Optimizer</div>
      <div class="company">by Macro Tech Titan</div>
    </div>
  </div>
  <div class="version-badge">v1.1.0 &nbsp;·&nbsp; Windows Edition</div>
  <div class="progress-wrap">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="bar"></div>
    </div>
    <div class="status-text" id="status">Initializing system modules...</div>
  </div>
</div>
<div class="mtt-link">More tools &amp; resources at <span>macrotechtitan.com</span></div>
<script>
  const steps = [
    [10,  'Initializing system modules...'],
    [30,  'Starting monitoring engine...'],
    [55,  'Loading optimization profiles...'],
    [78,  'Preparing dashboard...'],
    [95,  'Almost ready...'],
    [100, 'Launching...']
  ];
  const bar = document.getElementById('bar');
  const status = document.getElementById('status');
  let i = 0;
  function nextStep() {
    if (i >= steps.length) return;
    const [pct, msg] = steps[i++];
    bar.style.width = pct + '%';
    status.textContent = msg;
    if (i < steps.length) {
      setTimeout(nextStep, 420);
    } else {
      setTimeout(function() {
        document.body.style.transition = 'opacity 0.25s ease';
        document.body.style.opacity = '0';
        setTimeout(function() {
          window.location.replace('/app?mode=desktop');
        }, 260);
      }, 300);
    }
  }
  setTimeout(nextStep, 80);
</script>
</body>
</html>
